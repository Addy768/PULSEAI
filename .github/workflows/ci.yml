name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  salesforce-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apex syntax check
        run: |
          npm i -g prettier@3 prettier-plugin-apex
          PLUGIN=$(npm root -g)/prettier-plugin-apex/dist/src/index.js
          status=0
          for f in salesforce/force-app/main/default/classes/*.cls salesforce/force-app/main/default/triggers/*.trigger; do
            prettier --plugin="$PLUGIN" --parser apex "$f" > /dev/null || status=1
          done
          exit $status
