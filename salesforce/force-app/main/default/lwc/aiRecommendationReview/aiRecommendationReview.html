<template>
    <lightning-card title="AI Triage" icon-name="utility:sparkles">
        <template lwc:if={rec}>
            <div class="slds-p-horizontal_medium">
                <dl class="slds-grid slds-wrap slds-gutters_x-small">
                    <div class="slds-col slds-size_1-of-2 slds-m-bottom_x-small">
                        <dt class="slds-text-title">Category</dt>
                        <dd>{rec.Suggested_Category__c} · {rec.Suggested_Subcategory__c}</dd>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-m-bottom_x-small">
                        <dt class="slds-text-title">Suggested priority</dt>
                        <dd>{rec.Suggested_Priority__c}</dd>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-m-bottom_x-small">
                        <dt class="slds-text-title">Team</dt>
                        <dd>{rec.Suggested_Team__c}</dd>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-m-bottom_x-small">
                        <dt class="slds-text-title">Confidence</dt>
                        <dd>
                            <div class="slds-progress-bar slds-progress-bar_small slds-m-top_xx-small" aria-valuemin="0" aria-valuemax="100" aria-valuenow={confidence} role="progressbar">
                                <span class="slds-progress-bar__value" style={confidenceStyle}></span>
                            </div>
                            {confidence}%
                        </dd>
                    </div>
                </dl>
                <p class="slds-text-title slds-m-top_small">Reason</p>
                <p>{rec.Reasoning__c}</p>
                <p class="slds-text-title slds-m-top_small">Evidence</p>
                <ul class="slds-list_dotted">
                    <template for:each={evidence} for:item="e">
                        <li key={e.key}>{e.text}</li>
                    </template>
                </ul>
                <p class="slds-text-title slds-m-top_small">Recommended action</p>
                <p>{rec.Recommended_Action__c}</p>

                <template lwc:if={isPending}>
                    <lightning-textarea class="slds-m-top_small" label="Reviewer notes" value={notes} onchange={handleNotes}></lightning-textarea>
                    <div class="slds-m-top_small">
                        <lightning-button-group>
                            <lightning-button label="Approve" variant="success" data-decision="Approved" onclick={decide} disabled={saving}></lightning-button>
                            <lightning-button label="Modify" data-decision="Modified" onclick={decide} disabled={saving}></lightning-button>
                            <lightning-button label="Reject" variant="destructive" data-decision="Rejected" onclick={decide} disabled={saving}></lightning-button>
                        </lightning-button-group>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-m-top_small slds-text-color_weak">Reviewed: {rec.Review_Status__c}. Model {rec.Model_Version__c}.</p>
                </template>
            </div>
        </template>
        <template lwc:else>
            <p class="slds-p-horizontal_medium slds-text-color_weak">No AI recommendation for this incident yet.</p>
        </template>
    </lightning-card>
</template>
